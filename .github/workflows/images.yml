name: Container images

on:
  push:
    branches: [main, feat/chatgpt-remote-access]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "deploy/remote/Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standalone
            target: final
            suffix: ""
          - variant: managed-sync
            target: managed-sync
            suffix: "-sync"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo "tags<<IMAGE_TAGS"
            echo "$image:sha-${GITHUB_SHA}$SUFFIX"
            if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              if [[ "$REF_TYPE" == tag ]]; then
                echo "$image:$REF_NAME$SUFFIX"
              elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
                echo "$image:latest$SUFFIX"
              elif [[ "$REF_NAME" == feat/chatgpt-remote-access ]]; then
                echo "$image:edge$SUFFIX"
              fi
            fi
            echo "IMAGE_TAGS"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/remote/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=images-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.variant }}
          provenance: mode=max
          sbom: true
